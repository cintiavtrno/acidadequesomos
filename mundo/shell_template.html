<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O balcão da vó — Etapa 7 · o mundo conectado</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d10; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #120d10; }
  iframe.on { display: block; }
  #noite { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: multiply; background: #fff; }
  #fade { position: absolute; inset: 0; background: #0d080b; opacity: 0; pointer-events: none; z-index: 5; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: .35em; color: #f0dcc0; font: 600 15px/1.3 Georgia, serif; letter-spacing: .02em; }
  #fade small { font: 400 11px/1.2 system-ui, sans-serif; color: #b8a58c; letter-spacing: .08em; text-transform: uppercase; }
  #dbg { position: absolute; left: 6px; bottom: 6px; z-index: 6; font: 11px/1.35 ui-monospace, monospace; color: #cfe; background: rgba(0,0,0,.65); padding: 4px 7px; border-radius: 4px; display: none; white-space: pre; max-width: 60vw; }
  #boot { position: absolute; inset: 0; z-index: 7; background: #120d10; color: #d9c7ad; display: flex; align-items: center; justify-content: center; font: 16px Georgia, serif; }
  #hist { position: absolute; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center; background: rgba(13,8,11,.94); color: #eadcc6; font: 17px/1.55 Georgia, 'Times New Roman', serif; overflow: auto; }
  #hist .card { max-width: 640px; margin: 24px; padding: 30px 34px; background: #1d1519; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #hist .ano { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #d9a45a; }
  #hist h1 { font: 700 30px/1.15 Georgia, serif; margin: .35em 0 .5em; color: #f6ead4; }
  #hist h3 { font: 600 12px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #b8a58c; margin: 1.3em 0 .5em; }
  #hist p { margin: .5em 0; } #hist ul { margin: .3em 0; padding-left: 1.2em; } #hist li { margin: .25em 0; }
  #hist kbd { font: 600 12px system-ui, sans-serif; background: #33262c; border-radius: 4px; padding: 1px 6px; color: #f3e3c8; }
  #hist button, #chip button { font: 600 15px system-ui, sans-serif; color: #1d1519; background: #f0c98c; border: 0; border-radius: 999px; padding: .65em 1.4em; cursor: pointer; margin-top: 1.2em; }
  #hist button:hover, #chip button:hover { background: #ffd9a0; }
  #chip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 3; font: 600 13px/1 system-ui, sans-serif; color: #f3e3c8; background: rgba(29,21,25,.82); border-radius: 999px; padding: .55em 1em; display: none; white-space: nowrap; }
  #chip button { margin: 0 0 0 .8em; padding: .35em .9em; font-size: 12px; }
  #chip .ok { color: #9fd3a8; }
</style>
</head>
<body>
<iframe id="f_rua" title="Rua"></iframe><iframe id="f_padaria" title="Padaria"></iframe><iframe id="f_casa" title="Casa de Seu Raimundo"></iframe><iframe id="f_quintal" title="Quintal de Dona Zefa"></iframe>
<div id="noite"></div>
<div id="chip"></div>
<div id="hist"><div class="card" id="histC"></div></div>
<div id="fade"><span id="fadeT"></span><small id="fadeS"></small></div>
<div id="dbg"></div>
<div id="boot">Montando o bairro…</div>
<script>/*MUNDO_JS*/</script>
<script>
const SRC = /*SRC*/{};
const Q = new URLSearchParams(location.search);
const dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const ANO = (Q.get('ano') || (function () { try { return localStorage.getItem('balcao_ano'); } catch (e) { return null; } })()) == '1994' && Q.get('new') !== '1' ? 1994 : 1991;
window.MUNDO_ANO = ANO;   // as simulações leem o ano (agenda da tarde, caruru)
const FR = {}; let mundo = null, ready = 0; const NOMES = { rua: 'Rua', padaria: 'Padaria de Vó Aurea', casa: 'Casa de Seu Raimundo', quintal: 'Quintal de Dona Zefa' };
const extra = '&mundo=1&rate=' + (Q.get('rate') || '3') + (Q.get('new') === '1' ? '&new=1' : '');
// o jogo de cada ambiente roda no próprio iframe (sem reconstruir nada); `srcdoc` mantém o acesso entre as janelas
for (const id of ['rua', 'padaria', 'casa', 'quintal']) {
  const f = document.getElementById('f_' + id); FR[id] = f;
  let html = dec(SRC[id]).replace('<head>', '<head><script>window.MUNDO_ANO = ' + ANO + ';<\/script>'); f.srcdoc = html;
}
window.MUNDO_BRIDGE = {
  entrar(cena, porta) { if (mundo) return mundo.ir('rua:' + porta); },
  sair(cena) { if (mundo) mundo.ir(cena + ':porta'); },
};
function mostrar(id) { for (const k in FR) FR[k].classList.toggle('on', k === id); const w = FR[id].contentWindow; try { w.dispatchEvent(new Event('resize')); w.focus(); } catch (e) { } }
function pronto() {
  const W = id => FR[id].contentWindow;
  for (const id in FR) { const w = W(id); if (!(w.BALCAO && w.BALCAO.SIM)) return false; }
  return true;
}
function montar() {
  const W = id => FR[id].contentWindow, B = id => W(id).BALCAO;
  const ui = {
    rua: { liaSaiu: () => B('rua').liaSaiu(), liaChega: p => B('rua').liaChega(p) },
    padaria: { liaSaiu: () => { }, liaChega: () => W('padaria').MUNDO_LIA() },
    casa: { liaSaiu: () => { }, liaChega: () => W('casa').MUNDO_LIA() },
    quintal: { liaSaiu: () => W('quintal').BALCAO.liaSaiu(), liaChega: () => W('quintal').MUNDO_LIA() },
  };
  const ad = { rua: Mundo.Adapters.rua(W('rua').eval('Sim'), B('rua').SIM, ui.rua), padaria: Mundo.Adapters.padaria(W('padaria').eval('Sim'), B('padaria').SIM, ui.padaria), casa: Mundo.Adapters.casa(W('casa').eval('Sim'), B('casa').SIM, ui.casa), quintal: Mundo.Adapters.quintal(null, B('quintal').SIM, ui.quintal) };
  // cada jogo calcula a colisão com o Sim.Nav do próprio iframe (global do iframe): antes de passar o tempo de um ambiente inativo, reativa a navegação dele
  for (const id of ['rua', 'padaria', 'casa', 'quintal']) { const a = ad[id], w = W(id); const base = a.step; a.step = dt => { const s = a.sim; if (id === 'rua') s.initNav && s.initNav(); base.call(a, dt); }; }
  mundo = Mundo.criar(ad, 'rua');
  mundo.on((t, d) => {
    if (t === 'transicao_inicio') { const dest = Mundo.PORTAS.find(p => p.id === d.porta).para; document.getElementById('fadeT').textContent = NOMES[dest]; document.getElementById('fadeS').textContent = dest === 'rua' ? 'rua · vista lateral' : 'interior · vista três-quartos'; }
    if (t === 'cena') mostrar(d.para);
  });
  mostrar('rua'); document.getElementById('boot').style.display = 'none'; historia();
  // inativos andam aqui (rAF do iframe escondido não roda); o ativo anda no laço do próprio jogo
  let last = performance.now(); (function laco(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; mundo.update(dt); noite(mundo.minuto()); document.getElementById('fade').style.opacity = mundo.trans.alpha; if (Q.get('debug') === '1') dbg(); requestAnimationFrame(laco); })(last);
  window.MUNDO = { mundo, frames: FR, ir: id => mundo.ir(id), estado: () => mundo.persist.instantaneo(), onde: () => mundo.viagens.onde, viagens: () => mundo.viagens.viagens, duplicados: () => mundo.viagens.duplicados(), cena: () => mundo.cenas.atual, minuto: () => mundo.minuto(), W };
}
// anoitecer: a luz acompanha o relógio mestre (multiplica a imagem: dia = sem efeito; 17:00 dourado; 18:00 roxo; 19:00+ noite azul). Não encerra o jogo.
const NOITE = [[900, [255, 255, 255]], [1020, [255, 205, 150]], [1080, [170, 120, 140]], [1140, [70, 82, 135]]];
function noite(m) { let c = NOITE[0][1]; if (m >= NOITE[NOITE.length - 1][0]) c = NOITE[NOITE.length - 1][1]; else for (let i = 1; i < NOITE.length; i++) if (m < NOITE[i][0]) { const a = NOITE[i - 1], b = NOITE[i], k = (m - a[0]) / (b[0] - a[0]); c = a[1].map((v, j) => Math.round(v + (b[1][j] - v) * k)); break; }
  const el = document.getElementById('noite'); if (el) el.style.background = 'rgb(' + c.join(',') + ')'; }
// ---- abertura, 1991 e 1994 (proposta: textos para revisar) ----
const META = { 1991: 10, 1994: 6 };
function pausar(p) { for (const id in FR) { try { const c = mundo.cenas.get(id); if (c && c.sim && c.sim.clock) c.sim.clock.paused = p; } catch (e) { } } }
function notas() { let n = 0; for (const id of ['rua', 'quintal']) { try { const s = FR[id].contentWindow.BALCAO.SIM; if (s && s.kp) n += Object.keys(s.kp).length; } catch (e) { } } return n; }
function tela(html, btn, fn) { const h = document.getElementById('hist'); document.getElementById('histC').innerHTML = html + '<button id="hbtn">' + btn + '</button>'; h.style.display = 'flex'; pausar(true); try { window.focus(); document.activeElement && document.activeElement.blur(); } catch (e) { } document.getElementById('hbtn').onclick = () => { h.style.display = 'none'; pausar(false); mostrar(mundo.cenas.atual); fn && fn(); }; }
const COMO = '<h3>Como jogar</h3><ul><li><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> ou <kbd>W A S D</kbd> andam. Também dá para clicar no chão.</li><li><kbd>E</kbd> conversa, examina, pega e entra nas portas. No balcão da padaria, <kbd>E</kbd> atende a freguesia.</li><li><kbd>B</kbd> abre o caderninho com tudo o que você anotou.</li><li>Fique perto de quem conversa. Ouvir rende anotações tanto quanto perguntar.</li></ul>';
function historia() {
  if (Q.get('new') === '1') { try { localStorage.removeItem('balcao_ano'); localStorage.removeItem('balcao_base'); } catch (e) { } }
  if (Q.get('skip') === '1') return;   // testes automáticos
  let base = 0; try { base = +localStorage.getItem('balcao_base') || 0; } catch (e) { }
  let retorno = false; try { retorno = localStorage.getItem('balcao_retorno') === '1'; localStorage.removeItem('balcao_retorno'); } catch (e) { }
  const chip = document.getElementById('chip');
  let visitou = false, fim = false;
  const fimDoDia = (n, meta, pronto) => {
    fim = true; chip.style.display = 'none';
    if (pronto) { if (ANO === 1991) tela(ANOITECEU_91(n), 'Seguir para 1994', para94); else tela(FIM94, 'Recomeçar do início', recomecar); }
    else tela(ANOITECEU(n, meta), 'Recomeçar o dia', amanha);
  };
  setInterval(() => {
    if (fim || document.getElementById('hist').style.display === 'flex') return;
    const n = notas() - (ANO === 1994 ? base : 0), meta = META[ANO]; if (ANO === 1994 && mundo.cenas.atual === 'quintal' && mundo.minuto() >= 720) visitou = true;
    const pronto = ANO === 1991 ? n >= meta : (n >= meta && visitou);
    if (mundo.minuto() >= FIM_DIA) { fimDoDia(n, meta, pronto); return; }
    chip.style.display = 'block';
    chip.innerHTML = ANO === 1991 ? '<b>1991</b> · anotações ' + Math.min(n, meta) + '/' + meta + (pronto ? ' <span class="ok">✓</span><button id="cb">Seguir para 1994</button>' : '')
      : '<b>1994</b> · caruru ' + (visitou ? '<span class="ok">✓</span>' : '·') + ' · anotações novas ' + Math.min(n, meta) + '/' + meta + (pronto ? ' <button id="cb">Encerrar a fase</button>' : '');
    const b = document.getElementById('cb'); if (b) b.onclick = () => { if (ANO === 1991) para94(); else { fim = true; chip.style.display = 'none'; tela(FIM94, 'Recomeçar do início', recomecar); } };
  }, 500);
  if (retorno) return;   // novo dia da mesma fase: sem abertura
  if (ANO === 1991) tela(INTRO, 'Continuar', () => tela(C91, 'Entrar em 1991'));
  else tela(C94, 'Começar 1994');
}
const FIM_DIA = 1140;   // 19:00: o dia acaba para todos os ambientes ao mesmo tempo
function recomecar() { try { localStorage.removeItem('balcao_ano'); localStorage.removeItem('balcao_base'); localStorage.removeItem('balcao_retorno'); } catch (e) { } location.search = '?new=1'; }
function amanha() { try { localStorage.setItem('balcao_retorno', '1'); } catch (e) { } const u = new URLSearchParams(location.search); u.delete('new'); const s = u.toString(); if (s === location.search.replace(/^\?/, '')) location.reload(); else location.search = s; }
function para94() {
  try { localStorage.setItem('balcao_ano', '1994'); localStorage.setItem('balcao_base', String(notas())); } catch (e) { }
  const f = document.getElementById('fade'); document.getElementById('fadeT').textContent = '1994'; document.getElementById('fadeS').textContent = 'três anos depois'; f.style.transition = 'opacity 1.2s'; f.style.opacity = 1; pausar(true);
  setTimeout(() => { location.search = '?ano=1994'; }, 1900);
}
const INTRO = '<div class="ano">Pelourinho, Salvador</div><h1>O balcão da vó</h1><p>Você é Lia, neta de Dona Áurea. Seus dias passam entre a padaria da família, a calçada, o sobrado de Seu Raimundo e o quintal de Dona Zefa.</p><p>O Programa chegou ao bairro com gente de fora medindo a rua. Você conversa com os moradores, ajuda quem pede ajuda e anota o que descobre no caderninho.</p><p>Não há lado certo para escolher. Cada morador tem as suas razões. Elas aparecem aos poucos para quem fica por perto.</p>';
const C91 = '<div class="ano">1991</div><h1>O Programa foi anunciado</h1><p>O rádio deu a notícia e a rua inteira ouviu. Ninguém sabe direito o que vai mudar. Lia tem 10 anos e passa as manhãs entre o balcão da vó e a calçada.</p><h3>Objetivo</h3><p>Reunir informações sobre o Programa e sobre quem vive aqui. Converse com os moradores, observe a rua, ajude no que pedirem e anote.</p><h3>Para seguir adiante</h3><p>Faça <b>10 anotações</b>. Quando chegar lá, o botão para seguir para 1994 aparece no alto da tela. Em 1994 Dona Zefa faz um caruru e convida a rua.</p>' + COMO;
const C94 = '<div class="ano">1994</div><h1>O caruru de Dona Zefa</h1><p>Três anos depois, Lia tem 13 anos. Dona Zefa convidou a rua inteira para um caruru no quintal dela, a partir do meio-dia. O Programa já saiu do papel. A rua tem obra, medição e gente nova.</p><h3>Objetivo</h3><p>Ver como ficaram o bairro e a vizinhança depois que o Programa começou. Vá ao caruru, ajude no que pedirem e ouça o que cada um diz.</p><h3>Para encerrar a fase</h3><p>Vá ao quintal de Dona Zefa durante o caruru e faça <b>6 anotações novas</b>.</p>' + COMO;
const ANOITECEU = (n, meta) => '<div class="ano">19:00</div><h1>Anoiteceu</h1><p>Você tem ' + Math.min(n, meta) + ' de ' + meta + ' anotações. Faltam ' + Math.max(0, meta - n) + '. Amanhã a rua recomeça de manhã. O caderninho guarda o que você já anotou.</p>';
const ANOITECEU_91 = n => '<div class="ano">19:00</div><h1>1991 terminou</h1><p>Você fez ' + n + ' anotações. Três anos depois, Dona Zefa faz um caruru e convida a rua.</p>';
const FIM94 = '<div class="ano">Fim da fase de 1994</div><h1>Fim de 1994</h1><p>O caruru terminou e a conversa continua na calçada. Você viu o que mudou no bairro e o que as pessoas seguem fazendo umas pelas outras. As fases de 1996 em diante ainda não existem.</p>';
function dbg() { const d = document.getElementById('dbg'); d.style.display = 'block'; const m = mundo.minuto(); d.textContent = 'cena ' + mundo.cenas.atual + ' · ' + String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0') + '\nonde ' + JSON.stringify(mundo.viagens.onde); }
const iv = setInterval(() => { if (pronto()) { clearInterval(iv); montar(); } }, 120);
</script>
</body>
</html>
