const VW = 480, VH = 270;
const WORLD_W = 1130, DOOR_X = 470, DOOR_HALF = 26;
const X0 = 72, X1 = 408, YB = 124, YF = 252, EXIT_X = 240;
const FW = 16, FH = 44;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);

const fGround = x => 222 + Math.floor(Math.max(0, x) / 36);

function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
let IMG = {};
Promise.all(Object.entries(ASSETS).map(([k, v]) => load(v).then(i => IMG[k] = i))).then(start);

const S = {
  scene: Q.get('s') === 'interior' ? 'interior' : 'street',
  kind: Q.get('t') === 'adult' ? 'adult' : 'lia',
  ruler: Q.get('r') === '1', coll: Q.get('c') === '1',
  p: { x: 430, y: fGround(430), dir: 'r', moving: false, t: 0, tx: null, ty: null, enter: false, stuck: 0 },
  cam: 0, fade: 0, fadeDir: 0, fadeNext: null, msg: ''
};
if (Q.has('x')) S.p.x = +Q.get('x');
if (S.scene === 'interior') { S.p.x = Q.has('x') ? +Q.get('x') : EXIT_X; S.p.y = Q.has('y') ? +Q.get('y') : YF - 14; S.p.dir = 'u'; }
else S.p.y = fGround(S.p.x);
S.cam = Math.max(0, Math.min(WORLD_W - VW, Math.round(S.p.x) - 240));
if (Q.has('cam')) S.cam = +Q.get('cam');

const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft','arrowright','arrowup','arrowdown',' ','a','d','w','s','e','enter','t','r','c'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 't') toggleKind(); if (k === 'r') toggle('ruler'); if (k === 'c') toggle('coll');
  if ((k === 'e' || k === 'enter' || k === ' ') && S.scene === 'street' && nearDoor()) beginEnter();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const bT = document.getElementById('bT'), bR = document.getElementById('bR'), bC = document.getElementById('bC');
function toggleKind() { S.kind = S.kind === 'lia' ? 'adult' : 'lia'; syncUI(); }
function toggle(n) { S[n] = !S[n]; syncUI(); }
function syncUI() {
  bT.textContent = 'Personagem: ' + (S.kind === 'lia' ? 'Lia 1,38 m' : 'adulto 1,75 m');
  bR.setAttribute('aria-pressed', S.ruler); bC.setAttribute('aria-pressed', S.coll);
  document.getElementById('scene').textContent = S.scene === 'street' ? 'Rua' : 'Padaria — interior';
  document.getElementById('cam').textContent = S.scene === 'street'
    ? 'câmera lateral ortográfica (side-view): fachadas frontais, andar só na horizontal'
    : 'câmera 3/4 oblíqua: frente + topo visíveis, andar em profundidade';
}
bT.onclick = toggleKind; bR.onclick = () => toggle('ruler'); bC.onclick = () => toggle('coll');

function fit() {
  const hud = document.getElementById('hud').offsetHeight + 26;
  let s = Math.min(innerWidth / VW, (innerHeight - hud) / VH);
  s = s >= 1 ? Math.floor(s) : Math.max(0.5, s);
  cvs.style.width = VW * s + 'px'; cvs.style.height = VH * s + 'px';
}
addEventListener('resize', fit);

cvs.addEventListener('pointerdown', e => {
  window.focus();
  if (S.fadeDir) return;
  const r = cvs.getBoundingClientRect();
  const cx = (e.clientX - r.left) / r.width * VW, cy = (e.clientY - r.top) / r.height * VH;
  const p = S.p; p.stuck = 0;
  if (S.scene === 'street') {
    const wx = S.cam + cx;
    if (Math.abs(wx - DOOR_X) <= 30 && cy > 140 && cy < 235) { p.tx = DOOR_X; p.enter = true; }
    else { p.tx = Math.max(14, Math.min(WORLD_W - 14, wx)); p.enter = false; }
  } else {
    if (cy >= YF - 4 && Math.abs(cx - EXIT_X) <= 26) { p.tx = EXIT_X; p.ty = YF + 6; }
    else { p.tx = cx; p.ty = Math.max(YB + 6, Math.min(YF - 6, cy)); }
  }
});

// ---------- colisão do interior (pés = ponto) ----------
const SOLIDS = [
  [130, YB, 228, 146],          // base do forno
  [126, 164, 340, 182],         // balcão em L: frente
  [306, YB, 340, 182],          // balcão em L: retorno até a parede
];
function blockedIn(x, y) {
  const inGap = Math.abs(x - EXIT_X) <= 24;
  if (x < X0 + 8 || x > X1 - 8) return true;
  if (y < YB + 6) return true;
  if (y > YF - 6 && !inGap) return true;
  if (y > YF + 10) return true;
  for (const [a, b, c, d] of SOLIDS) if (x >= a && x <= c && y >= b && y <= d) return true;
  return false;
}
function nearDoor() { return Math.abs(S.p.x - DOOR_X) <= 22; }

function beginEnter() { startFade('interior'); }
function startFade(next) {
  if (S.fadeDir) return;
  S.fadeNext = next; S.fadeDir = 1; S.p.tx = null; S.p.ty = null; S.p.enter = false;
  if (reduce) S.fade = 1;
}
function swapScene() {
  const p = S.p;
  if (S.fadeNext === 'interior') { S.scene = 'interior'; p.x = EXIT_X; p.y = YF - 12; p.dir = 'u'; }
  else { S.scene = 'street'; p.x = DOOR_X; p.y = fGround(DOOR_X); p.dir = 'r'; S.cam = Math.max(0, Math.min(WORLD_W - VW, DOOR_X - 240)); }
  p.moving = false; syncUI();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
function start() {
  fit(); syncUI(); if (Q.get('go') === '1') beginEnter();
  const n = +(Q.get('step') || 0); for (let i = 0; i < n; i++) update(0.05);   // passos simulados (testes)
  requestAnimationFrame(frame);
}

function update(dt) {
  const p = S.p;
  // fade
  if (S.fadeDir === 1) { S.fade = Math.min(1, S.fade + dt / (reduce ? 0.01 : 0.22)); if (S.fade >= 1) { swapScene(); S.fadeDir = -1; } }
  else if (S.fadeDir === -1) { S.fade = Math.max(0, S.fade - dt / (reduce ? 0.01 : 0.22)); if (S.fade <= 0) S.fadeDir = 0; }
  if (S.fadeDir) { p.moving = false; return; }

  let ix = 0, iy = 0;
  if (keys['arrowleft'] || keys['a']) ix -= 1;
  if (keys['arrowright'] || keys['d']) ix += 1;
  if (keys['arrowup'] || keys['w']) iy -= 1;
  if (keys['arrowdown'] || keys['s']) iy += 1;
  if (ix || iy) { p.tx = null; p.ty = null; p.enter = false; }
  else if (p.tx != null) {
    const dx = p.tx - p.x, dy = p.ty != null ? p.ty - p.y : 0;
    if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) {
      p.tx = null; p.ty = null; if (S.scene === 'street' && p.enter) beginEnter();
    } else { ix = Math.abs(dx) < 1.2 ? 0 : Math.sign(dx); iy = Math.abs(dy) < 1.2 ? 0 : Math.sign(dy); }
  }
  const SPD = 45;                                   // px/s horizontal (~1,9 m/s)
  p.moving = false;
  if (S.scene === 'street') {
    if (ix) { p.x = Math.max(14, Math.min(WORLD_W - 14, p.x + ix * SPD * dt)); p.dir = ix < 0 ? 'l' : 'r'; p.moving = true; }
    if (iy < 0 && nearDoor() && !p.tx) { beginEnter(); }
    p.y = fGround(p.x);
    const want = Math.max(0, Math.min(WORLD_W - VW, Math.round(p.x) - 240));
    S.cam += (want - S.cam) * Math.min(1, dt * 7);
  } else {
    const vy = SPD * 16 / 24;                       // mesma velocidade real: profundidade vale 16 px/m
    const L = ix && iy ? 0.7071 : 1;
    const nx = p.x + ix * SPD * L * dt, ny = p.y + iy * vy * L * dt;
    const ox = p.x, oy = p.y;
    if (!blockedIn(nx, p.y)) p.x = nx;
    if (!blockedIn(p.x, ny)) p.y = ny;
    if (ix || iy) {
      p.moving = Math.abs(p.x - ox) + Math.abs(p.y - oy) > 0.01;
      if (Math.abs(ix) >= Math.abs(iy) && ix) p.dir = ix < 0 ? 'l' : 'r'; else if (iy) p.dir = iy < 0 ? 'u' : 'd';
      if (!p.moving && p.tx != null) { p.stuck++; if (p.stuck > 8) { p.tx = null; p.ty = null; p.stuck = 0; } }
    }
    if (p.y > YF - 1 && Math.abs(p.x - EXIT_X) <= 24) startFade('street');
  }
  if (p.moving) p.t += dt; else p.t = 0;
  S.msg = '';
  if (S.scene === 'street' && nearDoor()) S.msg = 'E / ↑ / toque na porta: entrar na padaria';
  if (S.scene === 'interior' && p.y > YF - 30 && Math.abs(p.x - EXIT_X) <= 30) S.msg = 'Desça pela soleira para sair para a rua';
  document.getElementById('msg').textContent = S.msg;
}

// ---------- desenho ----------
function sprite(kind, x, y, dir, moving, t, alpha) {
  const img = IMG['mannequin_' + kind];
  const view = dir === 'u' ? 2 : dir === 'd' ? 1 : 0;
  const ph = moving ? Math.floor(t * 8) % 4 : 0;
  const px = Math.round(x), py = Math.round(y);
  ctx.fillStyle = 'rgba(18,10,28,0.34)';
  ctx.fillRect(px - 5, py - 1, 10, 1); ctx.fillRect(px - 6, py, 12, 1); ctx.fillRect(px - 4, py + 1, 8, 1);
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  if (dir === 'l') { ctx.translate(px + 8, 0); ctx.scale(-1, 1); ctx.drawImage(img, ph * FW, view * FH, FW, FH, 0, py - (FH - 1), FW, FH); }
  else ctx.drawImage(img, ph * FW, view * FH, FW, FH, px - 8, py - (FH - 1), FW, FH);
  ctx.restore();
}
const other = () => S.kind === 'lia' ? 'adult' : 'lia';

function drawStreet() {
  const cam = Math.round(S.cam);
  ctx.drawImage(IMG.street_far, Math.floor(cam * 0.35), 0, VW, VH, 0, 0, VW, VH);
  ctx.drawImage(IMG.street_world, cam, 0, VW, VH, 0, 0, VW, VH);
  // referência de escala parada: o outro porte, ao lado da porta
  sprite(other(), 528, fGround(528), 'l', false, 0);
  sprite(S.kind, S.p.x - cam, S.p.y, S.p.dir, S.p.moving, S.p.t);
  if (S.ruler) {
    ctx.save(); ctx.font = '8px monospace'; ctx.textBaseline = 'middle';
    const px = Math.round(S.p.x - cam), py = Math.round(S.p.y);
    for (let wx = Math.ceil(cam / 24) * 24; wx < cam + VW; wx += 24) {
      const gy = fGround(wx), x = wx - cam;
      ctx.fillStyle = wx % 120 === 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.45)';
      ctx.fillRect(x, gy - 1, 1, wx % 120 === 0 ? 7 : 4);
    }
    for (let m = 0; m <= 4; m++) {
      const y = py - m * 24;
      ctx.fillStyle = 'rgba(255,230,120,.95)'; ctx.fillRect(px + 14, y, 10, 1);
      if (m) { ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(px + 25, y - 5, 17, 9); ctx.fillStyle = '#ffe678'; ctx.fillText(m + ' m', px + 27, y); }
    }
    ctx.fillStyle = 'rgba(255,230,120,.5)'; ctx.fillRect(px + 14, py - 96, 1, 96);
    ctx.restore();
  }
  if (S.coll) {
    ctx.fillStyle = 'rgba(255,60,60,.35)';
    ctx.fillRect(DOOR_X - 22 - cam, 150, 44, 85);
  }
}

function drawInterior() {
  ctx.drawImage(IMG.bakery_interior_base, 0, 0);
  const ents = [
    { y: 152, draw: () => sprite(other(), 262, 152, 'd', false, 0) },
    { y: S.p.y, draw: () => sprite(S.kind, S.p.x, S.p.y, S.p.dir, S.p.moving, S.p.t) },
  ];
  const behind = ents.filter(e => e.y < 172).sort((a, b) => a.y - b.y);
  const front = ents.filter(e => e.y >= 172).sort((a, b) => a.y - b.y);
  behind.forEach(e => e.draw());
  ctx.drawImage(IMG.bakery_counter, 0, 0);
  front.forEach(e => e.draw());
  if (S.ruler) {
    ctx.save(); ctx.font = '8px monospace'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let m = 0; m <= 14; m++) { const x = X0 + m * 24 + .5; ctx.moveTo(x, YB); ctx.lineTo(x, YF); }
    for (let m = 0; m <= 8; m++) { const y = YB + m * 16 + .5; ctx.moveTo(X0, y); ctx.lineTo(X1, y); }
    ctx.stroke();
    for (let m = 0; m <= 4; m++) {
      const y = YB - m * 24;
      ctx.fillStyle = 'rgba(255,230,120,.95)'; ctx.fillRect(X0 + 2, y, 12, 1);
      if (m) { ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(X0 + 15, y - 5, 17, 9); ctx.fillStyle = '#ffe678'; ctx.fillText(m + ' m', X0 + 17, y); }
    }
    for (let m = 1; m <= 8; m++) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(X1 + 3, YB + m * 16 - 4, 14, 8); ctx.fillStyle = '#9fe0c8'; ctx.fillText(m + 'm', X1 + 5, YB + m * 16); }
    ctx.restore();
  }
  if (S.coll) {
    ctx.fillStyle = 'rgba(255,60,60,.32)';
    for (const [a, b, c, d] of SOLIDS) ctx.fillRect(a, b, c - a, d - b);
    ctx.fillStyle = 'rgba(80,255,120,.28)'; ctx.fillRect(EXIT_X - 24, YF - 6, 48, 16);
  }
}

function draw() {
  ctx.fillStyle = '#140f12'; ctx.fillRect(0, 0, VW, VH);
  if (S.scene === 'street') drawStreet(); else drawInterior();
  if (S.fade > 0) { ctx.fillStyle = 'rgba(12,8,10,' + S.fade + ')'; ctx.fillRect(0, 0, VW, VH); }
}
